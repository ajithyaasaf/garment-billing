name: Auto Deploy Backend to Hugging Face

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Sync Backend to Hugging Face Space
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push backend directory to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix backend -b hf-deploy
          git push https://yaasaf:${HF_TOKEN}@huggingface.co/spaces/yaasaf/garment-erp-backend hf-deploy:main --force
